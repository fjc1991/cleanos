name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test CleanCore
        run: swift test --package-path Packages/CleanCore
      - name: Test UpdateSources
        run: swift test --package-path Packages/UpdateSources
      # Rehearses the release path on every push: Release build, signing, the startup check and the DMG.
      - name: Package the app (release dry run)
        run: SKIP_TESTS=1 SKIP_APPCAST=1 Scripts/release.sh
