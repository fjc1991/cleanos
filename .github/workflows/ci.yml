name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test HelperProtocol
        run: swift test --package-path Packages/HelperProtocol
      - name: Test CleanCore
        run: swift test --package-path Packages/CleanCore
      - name: Test UpdateSources
        run: swift test --package-path Packages/UpdateSources
      # Rehearses the release path on every push with a throwaway certificate made the same way as the project's
      # (Scripts/signing-cert.sh): Release build, inside-out signing, the startup check and the DMG.
      - name: Create a throwaway signing certificate
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=CleanOS Code Signing\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > cert.cnf
          /usr/bin/openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes -keyout key.pem -out cert.pem -config cert.cnf
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "CleanOS Code Signing" -out cert.p12 -passout pass:ci
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -P ci -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm key.pem cert.p12
      - name: Package the app (release dry run)
        run: CODESIGN_IDENTITY="CleanOS Code Signing" SKIP_TESTS=1 SKIP_APPCAST=1 Scripts/release.sh
      - name: Check the signature
        run: |
          APP=build/Release/Build/Products/Release/CleanOS.app
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier"
          codesign -dvv "$APP/Contents/MacOS/com.cleanos.helper" 2>&1 | grep -E "Authority=CleanOS Code Signing"
